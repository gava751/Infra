apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  labels:
    app.kubernetes.io/part-of: innoboard
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_SHUTDOWN: "graceful"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  USER_SERVICE_URL: "http://user-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
  PAYMENT_SERVICE_URL: "http://payment-service:8084"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  labels:
    app.kubernetes.io/part-of: innoboard
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_SHUTDOWN: "graceful"
  USER_SERVICE_URL: "http://user-service:8082"
  JWT_PRIVATE_KEY_PATH: "/app/keys/jwt-private.pem"
  JWT_PUBLIC_KEY_PATH: "/app/keys/jwt-public.pem"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "7d"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  labels:
    app.kubernetes.io/part-of: innoboard
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_SHUTDOWN: "graceful"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  REDIS_HOST: "user-redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  labels:
    app.kubernetes.io/part-of: innoboard
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_SHUTDOWN: "graceful"
  USER_SERVICE_URL: "http://user-service:8082"
  REDIS_HOST: "order-redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  PAYMENT_EVENTS_TOPIC: "payment-events"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  labels:
    app.kubernetes.io/part-of: innoboard
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_SHUTDOWN: "graceful"
  USER_SERVICE_URL: "http://user-service:8082"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  PAYMENT_EVENTS_TOPIC: "payment-events"
  RANDOM_NUMBER_URL: "https://www.random.org/integers/?num=1&min=0&max=1000&col=1&base=10&format=plain&rnd=new"
