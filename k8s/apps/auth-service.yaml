apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
    app.kubernetes.io/part-of: innoboard
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    app.kubernetes.io/part-of: innoboard
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: innoboard
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 auth-postgres 5432; do echo "waiting for auth-postgres"; sleep 2; done
              until nc -z -w 2 user-service 8082; do echo "waiting for user-service"; sleep 2; done
      containers:
        - name: auth-service
          image: innoboard/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: innoboard-secrets
                  key: AUTH_DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: innoboard-secrets
                  key: AUTH_POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: innoboard-secrets
                  key: AUTH_POSTGRES_PASSWORD
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: innoboard-secrets
                  key: INTERNAL_SERVICE_TOKEN
            - name: JWT_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: innoboard-secrets
                  key: JWT_KEY_ID
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0444
