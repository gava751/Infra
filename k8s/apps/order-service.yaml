apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
    app.kubernetes.io/part-of: innoboard
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    app.kubernetes.io/part-of: innoboard
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/part-of: innoboard
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 order-postgres 5432; do echo "waiting for order-postgres"; sleep 2; done
              until nc -z -w 2 order-redis 6379; do echo "waiting for order-redis"; sleep 2; done
              until nc -z -w 2 kafka 9092; do echo "waiting for kafka"; sleep 2; done
              until nc -z -w 2 user-service 8082; do echo "waiting for user-service"; sleep 2; done
      containers:
        - name: order-service
          image: innoboard/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: order-service-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: innoboard-secrets
                  key: ORDER_DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: innoboard-secrets
                  key: ORDER_POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: innoboard-secrets
                  key: ORDER_POSTGRES_PASSWORD
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: innoboard-secrets
                  key: INTERNAL_SERVICE_TOKEN
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
