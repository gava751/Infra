services:
  api-gateway:
    build: ../api-gateway
    container_name: api-gateway
    depends_on:
      auth-service-app:
        condition: service_healthy
      user-service-app:
        condition: service_healthy
      order-service-app:
        condition: service_healthy
      payment-service-app:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service-app:8081
      USER_SERVICE_URL: http://user-service-app:8082
      ORDER_SERVICE_URL: http://order-service-app:8083
      PAYMENT_SERVICE_URL: http://payment-service-app:8084
    ports:
      - "8080:8080"
    networks:
      - innoboard-internal

  auth-service-app:
    build: ../auth-service
    container_name: auth-service-app
    depends_on:
      auth-postgres:
        condition: service_healthy
      user-service-app:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://auth-postgres:5432/${AUTH_POSTGRES_DB}
      DB_USERNAME: ${AUTH_POSTGRES_USER}
      DB_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      USER_SERVICE_URL: http://user-service-app:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is not set}
      JWT_KEY_ID: ${JWT_KEY_ID:-auth-service-1}
      JWT_PRIVATE_KEY_PATH: keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: keys/jwt-public.pem
    volumes:
      - ../auth-service/keys:/app/keys:ro
    expose:
      - "8081"
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service-app:
    build: ../user-service
    container_name: user-service-app
    depends_on:
      user-postgres:
        condition: service_healthy
      user-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://user-postgres:5432/${USER_POSTGRES_DB}
      DB_USERNAME: ${USER_POSTGRES_USER}
      DB_PASSWORD: ${USER_POSTGRES_PASSWORD}
      REDIS_HOST: user-redis
      AUTH_SERVICE_URL: http://auth-service-app:8081
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is not set}
    expose:
      - "8082"
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service-app:
    build: ../order-service
    container_name: order-service-app
    depends_on:
      order-postgres:
        condition: service_healthy
      order-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://order-postgres:5432/${ORDER_POSTGRES_DB}
      DB_USERNAME: ${ORDER_POSTGRES_USER}
      DB_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
      REDIS_HOST: order-redis
      USER_SERVICE_URL: http://user-service-app:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is not set}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    expose:
      - "8083"
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-service-app:
    build: ../payment-service
    container_name: payment-service-app
    depends_on:
      payment-mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service-app:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      MONGO_URI: mongodb://${PAYMENT_MONGO_USER}:${PAYMENT_MONGO_PASSWORD}@payment-mongo:27017/${PAYMENT_MONGO_DB}?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_URL: http://user-service-app:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is not set}
    expose:
      - "8084"
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-mongo:
    image: mongo:8.0
    container_name: payment-service-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PAYMENT_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PAYMENT_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${PAYMENT_MONGO_DB}
    volumes:
      - payment-mongo-data:/data/db
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: innoboard-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  auth-postgres:
    image: postgres:18-alpine
    container_name: auth-service-postgres
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/18/docker
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-postgres:
    image: postgres:18-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_USER: ${USER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_POSTGRES_DB}
    volumes:
      - user-postgres-data:/var/lib/postgresql/18/docker
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-postgres:
    image: postgres:18-alpine
    container_name: order-service-postgres
    environment:
      POSTGRES_USER: ${ORDER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
    volumes:
      - order-postgres-data:/var/lib/postgresql/18/docker
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-redis:
    image: redis:7
    container_name: user-service-redis
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-redis:
    image: redis:7
    container_name: order-service-redis
    networks:
      - innoboard-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  payment-mongo-data:
  auth-postgres-data:
  user-postgres-data:
  order-postgres-data:

networks:
  innoboard-internal:
    driver: bridge
